# XcodeGen 工程定义：运行 `xcodegen generate` 生成 VoiceNotes.xcodeproj
# 仓库不提交 .xcodeproj，本地与 CI 都由本文件现生成，保证可复现。
name: VoiceNotes
options:
  projectFormat: xcode15
  bundleIdPrefix: com.dongzhou
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    # 开发者团队 ID 不写死在仓库里：本地在 Xcode 里选，或 CI 通过 xcodebuild 参数/Secrets 注入
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  VoiceNotes:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    info:
      path: VoiceNotes/Info.plist
    sources:
      - path: VoiceNotes
    settings:
      base:
        # 占位 Bundle ID：上架前在 App Store Connect 注册后如有冲突在此改一处即可
        PRODUCT_BUNDLE_IDENTIFIER: com.dongzhou.voicenotes
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
